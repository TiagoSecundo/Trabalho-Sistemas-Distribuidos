{% extends 'base.html' %}
{% block content %}
<style>
    .add-mono-page {
        padding: 2.2rem 0;
        background: radial-gradient(circle at top left, rgba(20, 184, 166, 0.13) 0%, rgba(20, 184, 166, 0) 35%);
        min-height: calc(100vh - 56px);
    }

    .add-mono-shell {
        max-width: 760px;
    }

    .add-mono-header {
        margin-bottom: 1rem;
    }

    .add-mono-header h1 {
        margin: 0 0 .45rem;
        font-weight: 800;
        color: #0f172a;
    }

    .add-mono-header p {
        margin: 0;
        color: #475569;
    }

    .add-mono-card {
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 20px 30px -32px rgba(15, 23, 42, 0.95);
    }

    .add-mono-card .card-body {
        padding: 1.35rem;
    }

    .add-mono-form p {
        margin-bottom: .9rem;
    }

    .add-mono-form label {
        display: block;
        margin-bottom: .35rem;
        font-weight: 700;
        color: #1e293b;
    }

    .add-mono-form input,
    .add-mono-form select,
    .add-mono-form textarea {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: .55rem .7rem;
        background: #fff;
        transition: border-color .2s ease, box-shadow .2s ease;
    }

    .add-mono-form textarea {
        min-height: 140px;
    }

    .add-mono-form input:focus,
    .add-mono-form select:focus,
    .add-mono-form textarea:focus {
        outline: 0;
        border-color: #0d9488;
        box-shadow: 0 0 0 0.2rem rgba(13, 148, 136, 0.15);
    }

    .add-mono-form ul.errorlist {
        margin: 0 0 .35rem;
        color: #b91c1c;
        padding-left: 1rem;
    }

    .btn-save-mono {
        border-radius: 999px;
        padding: .55rem 1.05rem;
        font-weight: 700;
        background: linear-gradient(120deg, #14b8a6 0%, #0d9488 100%);
        border: 0;
        color: #fff;
    }

    .btn-save-mono:hover {
        color: #fff;
        background: linear-gradient(120deg, #0d9488 0%, #0f766e 100%);
    }
</style>

<section class="add-mono-page">
    <div class="container add-mono-shell">
        <div class="add-mono-header">
            <h1>Adicionar monografia</h1>
            <p>Cadastre uma nova monografia informando título, discente, data de publicação e resumo.</p>
        </div>

        <div class="card add-mono-card">
            <div class="card-body">
                <form action="" method="post" class="add-mono-form">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-save-mono">Salvar monografia</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
