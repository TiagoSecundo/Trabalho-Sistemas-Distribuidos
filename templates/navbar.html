<nav class="navbar navbar-expand-lg navbar-dark app-navbar">

      <span class="brand-dot" aria-hidden="true"></span> AllTeam <small>Monografias</small>
    </a>
    <button class="navbar-toggler app-toggler" type="button" data-toggle="collapse" data-target="#mainNavbar"
      aria-controls="mainNavbar" aria-expanded="false" aria-label="Alternar navegação">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav ml-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link app-link" href="{% url 'index' %}" {% if request.path == '/' %}aria-current="page"{% endif %}>Início</a></li>

        <li class="nav-item"><a class="nav-link app-link" href="{% url 'usuarios:painel' %}" {% if request.resolver_match.namespace == 'usuarios' %}aria-current="page"{% endif %}>Meu painel</a></li>

        <li class="nav-item"><a class="nav-link app-link" href="{% url 'equipe:index' %}" {% if request.resolver_match.namespace == 'equipe' %}aria-current="page"{% endif %}>Cadastros</a></li>

        <li class="nav-item ml-lg-3">
          <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit" class="btn btn-outline-light btn-sm">Sair</button></form>

        <li class="nav-item ml-lg-2"><a class="btn app-cta-btn" href="{% url 'account_login' %}">Entrar</a></li>
