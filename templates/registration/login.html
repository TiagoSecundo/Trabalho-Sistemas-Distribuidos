{% extends 'base.html' %}
{% block title %}Entrar · AllTeam Monografias{% endblock %}
{% block content %}
<section class="crud-page container">
    <div class="crud-form-shell crud-card p-4">
        <span class="section-label text-muted">AllTeam Monografias</span>
        <h1>Acesse a gestão acadêmica</h1>
        <p>Entre com sua conta administrativa para organizar monografias, orientações e bancas.</p>
        <form method="post" class="crud-form">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn app-cta-btn">Entrar</button>
        </form>
    </div>
</section>
{% endblock %}
